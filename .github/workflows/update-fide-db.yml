name: Update FIDE Database

on:
  schedule:
    - cron: '23 6 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ✅ FIX [NET-IP-RANGE] : 3 tentatives en jobs séparés plutôt qu'un retry
  # interne au job. Chaque job = nouvelle VM GitHub = IP source potentiellement
  # différente, donc une vraie chance de contourner un blocage réseau côté FIDE
  # ciblant une IP/plage précise (voir _build-fide-db.yml pour le détail).
  attempt-1:
    uses: ./.github/workflows/_build-fide-db.yml
    secrets: inherit

  attempt-2:
    needs: attempt-1
    if: failure()
    uses: ./.github/workflows/_build-fide-db.yml
    secrets: inherit

  attempt-3:
    needs: attempt-2
    if: failure()
    uses: ./.github/workflows/_build-fide-db.yml
    secrets: inherit
